[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgefix"
version = "0.2.0"
description = "One command to set up, health-check, and repair any open-source project"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ForgeFix contributors" }]
keywords = ["dx", "cli", "setup", "health-check", "oss", "devtools", "onboarding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "mkdocs-material>=9.5",
    "build>=1.2",
]

[project.scripts]
forgefix = "forgefix.cli:app"

[project.entry-points."forgefix.plugins"]
example = "forgefix.plugins.example:ExamplePlugin"

[project.urls]
Homepage = "https://github.com/BistaDinesh03/forgefix"
Repository = "https://github.com/BistaDinesh03/forgefix"
Issues = "https://github.com/BistaDinesh03/forgefix/issues"
Changelog = "https://github.com/BistaDinesh03/forgefix/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["forgefix*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["forgefix"]
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "*.egg", ".venv"]
addopts = "--cov=forgefix --cov-report=term-missing"

[tool.coverage.run]
source = ["forgefix"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
