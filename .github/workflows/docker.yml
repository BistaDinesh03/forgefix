name: Docker

# Publishes the ForgeFix image to GitHub Container Registry so the repo's
# "Packages" section is populated. Uses the built-in GITHUB_TOKEN with
# packages: write - no PAT and no external registry involved.
#
# Triggers: Dockerfile changes on main, version tags, and manual dispatch.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bistadinesh03/forgefix

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tags=${IMAGE_NAME}:${TAG},${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        run: docker run --rm "${IMAGE_NAME}:latest" --version
