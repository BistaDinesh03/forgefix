name: Demo GIF

# Regenerates demo/demo.gif with vhs and commits it back to main.
# Trigger manually (workflow_dispatch) or when the tape script changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/demo.tape

permissions:
  contents: write

concurrency:
  group: gif
  cancel-in-progress: true

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forgefix (the tape runs the real CLI)
        run: python -m pip install -e .
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install vhs
        run: |
          curl -sSL "https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin vhs
          sudo chmod +x /usr/local/bin/vhs
          vhs --version
      - name: Record demo
        run: make gif
      - name: Size budget check (< 3 MB)
        run: |
          size=$(stat -c%s demo/demo.gif)
          echo "demo.gif is $size bytes"
          test "$size" -lt 3000000
      - name: Commit refreshed demo.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/demo.gif
          if git diff --staged --quiet; then
            echo "demo.gif unchanged"
          else
            git commit -m "demo: regenerate demo.gif [skip ci]"
            git push
          fi
