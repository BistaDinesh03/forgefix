name: Demo GIF

# Regenerates demo/demo.gif with vhs and commits it back to main.
# Trigger manually (workflow_dispatch) or when the tape script changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/demo.tape

permissions:
  contents: write

concurrency:
  group: gif
  cancel-in-progress: true

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push with an owner PAT (PUSH_TOKEN). The built-in GITHUB_TOKEN cannot
          # bypass branch protection on a personal repo: GitHub rejects the Actions
          # integration as a ruleset bypass actor, so the push must evaluate as
          # the owner (who has the bypass). Forks without the secret fall back to
          # GITHUB_TOKEN and simply cannot push the refresh commit.
          token: ${{ secrets.PUSH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forgefix (the tape runs the real CLI)
        run: python -m pip install -e .
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install vhs and ttyd
        run: |
          curl -sSL -o /tmp/vhs.tar.gz "https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz"
          mkdir -p /tmp/vhs-extract
          tar xzf /tmp/vhs.tar.gz -C /tmp/vhs-extract
          sudo install -m755 "$(find /tmp/vhs-extract -type f -name vhs | head -n1)" /usr/local/bin/vhs
          curl -sSL -o /tmp/ttyd "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64"
          sudo install -m755 /tmp/ttyd /usr/local/bin/ttyd
          vhs --version
          ttyd --version
      - name: Record demo
        run: make gif
      - name: Size budget check (< 3 MB)
        run: |
          size=$(stat -c%s demo/demo.gif)
          echo "demo.gif is $size bytes"
          test "$size" -lt 3000000
      - name: Commit refreshed demo.gif
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/demo.gif
          if git diff --staged --quiet; then
            echo "demo.gif unchanged"
          else
            git commit -m "demo: regenerate demo.gif [skip ci]"
            git push
          fi
