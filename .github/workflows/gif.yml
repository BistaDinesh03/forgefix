name: Demo GIF

# Regenerates demo/demo.gif AND demo/demo.mp4 with vhs and commits them back
# to main. Trigger manually (workflow_dispatch) or when the tape changes.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo/demo.tape
      - demo/prep_scratch.py
      - demo/show_generated.py

permissions:
  contents: write

concurrency:
  group: gif
  cancel-in-progress: true

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Push with an owner PAT (PUSH_TOKEN). The built-in GITHUB_TOKEN cannot
          # bypass branch protection on a personal repo: GitHub rejects the Actions
          # integration as a ruleset bypass actor, so the push must evaluate as
          # the owner (who has the bypass). Forks without the secret fall back to
          # GITHUB_TOKEN and simply cannot push the refresh commit.
          token: ${{ secrets.PUSH_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Warm the pip cache for the editable ForgeFix install. The demo's
          # scratch Node project installs from a local lockfile on camera.
          cache: pip
      - name: Install forgefix (the tape runs the real CLI)
        run: python -m pip install -e .
      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Install vhs and ttyd
        run: |
          curl -sSL -o /tmp/vhs.tar.gz "https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz"
          mkdir -p /tmp/vhs-extract
          tar xzf /tmp/vhs.tar.gz -C /tmp/vhs-extract
          sudo install -m755 "$(find /tmp/vhs-extract -type f -name vhs | head -n1)" /usr/local/bin/vhs
          curl -sSL -o /tmp/ttyd "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64"
          sudo install -m755 /tmp/ttyd /usr/local/bin/ttyd
          vhs --version
          ttyd --version
      - name: Record demo (gif + mp4 from one session)
        run: make gif
      - name: Size budget check (500 KB < gif < 4 MB)
        run: |
          size=$(stat -c%s demo/demo.gif)
          echo "demo.gif is $size bytes"
          test "$size" -gt 500000
          test "$size" -lt 4000000
      - name: Commit refreshed demo.gif and demo.mp4
        run: |
          # Attribute the commit to the maintainer, not github-actions[bot].
          # The checkout step above already authenticates with PUSH_TOKEN, so
          # the push is evaluated as the owner.
          git config user.name "BistaDinesh03"
          git config user.email "BistaDinesh03@users.noreply.github.com"
          git add demo/demo.gif demo/demo.mp4
          if git diff --staged --quiet; then
            echo "demo assets unchanged"
          else
            git commit -m "demo: regenerate demo.gif and demo.mp4 [skip ci]"
            # The badge workflow can commit to main at the same time.
            git pull --rebase origin main
            git push
          fi
