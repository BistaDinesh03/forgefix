[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-app"
version = "0.1.0"
description = "Minimal fixture project used by ForgeFix tests"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
